  <rect width="512" height="512" fill="#ffffff" rx="64"/>
  
  <!-- Leaf stem -->
  <path d="M256 400 L256 280" stroke="#16a34a" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Main leaf -->
