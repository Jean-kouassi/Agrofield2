<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Marketplace - AgroField</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%); }
    .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h1 { color: #16a34a; margin-bottom: 8px; }
    label { display: block; margin-top: 16px; font-weight: bold; color: #374151; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 6px; border: 2px solid #e5e7eb; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #16a34a; }
    button { background: #16a34a; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; }
    button:hover { background: #15803d; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .success { background: #dcfce7; border: 2px solid #16a34a; color: #166534; padding: 16px; border-radius: 8px; margin-top: 20px; }
    .error { background: #fee2e2; border: 2px solid #ef4444; color: #991b1b; padding: 16px; border-radius: 8px; margin-top: 20px; }
    .info { background: #dbeafe; border: 2px solid #3b82f6; color: #1e40af; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
    pre { background: #f3f4f6; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌾 Test Insertion Marketplace</h1>
    <p>Formulaire simplifié pour tester l'insertion directe dans Supabase</p>
  </div>

  <div id="auth-status" class="info">Vérification authentification...</div>

  <div class="card" id="form-card" style="display:none;">
    <form id="offer-form">
      <label for="title">Titre *</label>
      <input type="text" id="title" required placeholder="Ex: Tomates fraîches">

      <label for="description">Description *</label>
      <textarea id="description" required rows="4" placeholder="Décrivez votre produit..."></textarea>

      <label for="category">Catégorie *</label>
      <select id="category" required>
        <option value="">Choisir...</option>
        <option value="tomates">Tomates</option>
        <option value="oignons">Oignons</option>
        <option value="mil">Mil</option>
        <option value="sorgho">Sorgho</option>
        <option value="mais">Maïs</option>
        <option value="niebe">Niébé</option>
        <option value="arachide">Arachide</option>
        <option value="autre">Autre</option>
      </select>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div>
          <label for="quantity">Quantité *</label>
          <input type="number" id="quantity" step="0.01" required placeholder="100">
        </div>
        <div>
          <label for="price">Prix (FCFA) *</label>
          <input type="number" id="price" required placeholder="500">
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div>
          <label for="location">Ville *</label>
          <input type="text" id="location" required placeholder="Ouagadougou">
        </div>
        <div>
          <label for="region">Région *</label>
          <select id="region" required>
            <option value="">Choisir...</option>
            <option value="Centre">Centre</option>
            <option value="Hauts-Bassins">Hauts-Bassins</option>
            <option value="Boucle du Mouhoun">Boucle du Mouhoun</option>
            <option value="Cascades">Cascades</option>
            <option value="Centre-Est">Centre-Est</option>
            <option value="Centre-Nord">Centre-Nord</option>
            <option value="Centre-Ouest">Centre-Ouest</option>
            <option value="Centre-Sud">Centre-Sud</option>
            <option value="Est">Est</option>
            <option value="Nord">Nord</option>
            <option value="Plateau-Central">Plateau-Central</option>
            <option value="Sahel">Sahel</option>
            <option value="Sud-Ouest">Sud-Ouest</option>
          </select>
        </div>
      </div>

      <button type="submit" id="submit-btn">Publier l'offre</button>
    </form>

    <div id="result"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const supabaseUrl = 'https://vtnduxtrnahhbgvlhqjw.supabase.co'
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0bmR1eHRybmFoYmJndmxocWp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTMyNjk2MDMsImV4cCI6MjA2ODg0NTYwM30.dBqL3vXMKxT9N2YkPzMqGzRYn5uV8wQ3jK7pL2xDy2U'

    const supabase = createClient(supabaseUrl, supabaseKey)

    const authStatus = document.getElementById('auth-status')
    const formCard = document.getElementById('form-card')
    const resultDiv = document.getElementById('result')
    const submitBtn = document.getElementById('submit-btn')

    // Vérifier auth
    async function checkAuth() {
      const { data: { user }, error } = await supabase.auth.getUser()
      
      if (error || !user) {
        authStatus.innerHTML = `
          <strong>❌ Non connecté</strong><br>
          Vous devez être connecté pour publier une offre.<br>
          <a href="/auth" style="color: #16a34a; font-weight: bold;">Se connecter →</a>
        `
        return false
      }

      authStatus.innerHTML = `
        <strong>✅ Connecté en tant que :</strong> ${user.email}<br>
        User ID: <code>${user.id}</code>
      `
      formCard.style.display = 'block'
      return true
    }

    // Submit form
    document.getElementById('offer-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      
      submitBtn.disabled = true
      submitBtn.textContent = 'Publication en cours...'
      resultDiv.innerHTML = ''

      const offerData = {
        seller_id: (await supabase.auth.getUser()).data.user.id,
        seller_name: (await supabase.auth.getUser()).data.user.email || 'Agriculteur',
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        category: document.getElementById('category').value,
        quantity: parseFloat(document.getElementById('quantity').value),
        unit: 'kg',
        price: parseFloat(document.getElementById('price').value),
        location: document.getElementById('location').value,
        region: document.getElementById('region').value,
        images: [],
        available_from: new Date().toISOString(),
        expires_at: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString(),
        status: 'available',
        views: 0,
        contacts: 0
      }

      console.log('📤 Envoi données:', offerData)

      try {
        const { data, error } = await supabase
          .from('marketplace_listings')
          .insert([offerData])
          .select()

        if (error) throw error

        resultDiv.innerHTML = `
          <div class="success">
            <strong>✅ Offre publiée avec succès !</strong><br>
            ID: ${data[0].id}<br>
            Titre: ${data[0].title}<br>
            Prix: ${data[0].price} FCFA/${data[0].unit}<br>
            <br>
            <a href="/marketplace" style="color: #16a34a; font-weight: bold;">Voir sur le marketplace →</a>
          </div>
        `

        // Reset form
        document.getElementById('offer-form').reset()
      } catch (err) {
        resultDiv.innerHTML = `
          <div class="error">
            <strong>❌ Erreur:</strong><br>
            ${err.message}<br>
            <br>
            <details>
              <summary>Détails techniques</summary>
              <pre>${JSON.stringify(err, null, 2)}</pre>
            </details>
          </div>
        `
      } finally {
        submitBtn.disabled = false
        submitBtn.textContent = "Publier l'offre"
      }
    })

    // Init
    checkAuth()
  </script>
</body>
</html>
